<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="etere: a radio with one programme, a tide of cold ambient and 2-step every half hour, the same for everyone who tunes in.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<meta name="claude:viewport-fit-sides" content="cover">
<title>galaverna</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap">
<style>
/* Layout: one quiet column of words over a full-screen drawing. There is nothing to set: the whole middle of the page tunes in and out. Top right, the number of the tide on air and how far into its half hour it is, the same on every screen. The drawing is a tide gauge: a bright line of water that stands where the tide is, and under it the lines the music has left, sinking. */
:root{
  --bg:#253859; --ink:#E5DADA; --mute:#C0BDC8; --line:#435A85; --amber:#E59500; --wine:#D2577F; --night:#4A8CC4;
  --font:"Helvetica Neue","IBM Plex Sans",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-weight:400;font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:20px;position:relative;z-index:1;min-height:calc(100vh - 44px);min-height:calc(100dvh - 44px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.cap,.foot{text-shadow:0 0 10px var(--bg),0 0 3px var(--bg)}
#dial{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

header{display:flex;justify-content:space-between;align-items:baseline}
h1{font-weight:300;font-size:1.5rem;letter-spacing:-.01em;margin:0}
.titleblock{display:flex;flex-direction:column;gap:2px}
.tag{font-size:.78rem;color:var(--mute);letter-spacing:.02em}
#clock{color:var(--mute);font-size:.95rem}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
#tideNo{font-size:.78rem;color:var(--mute);letter-spacing:.02em}

.stage{display:block;width:100%;flex:1;min-height:36vh;position:relative;-webkit-tap-highlight-color:transparent}
.stage:focus-visible{outline:1px solid var(--amber);outline-offset:3px}
#tap{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);font-weight:300;font-size:1.9rem;letter-spacing:-.02em;
  color:var(--mute);pointer-events:none}

.cap{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-6px;text-align:center;min-height:4.4rem}
#nowA{font-weight:300;font-size:1.6rem;letter-spacing:-.01em;line-height:1.15;text-wrap:balance;max-width:22ch}
#nowB{color:var(--mute);font-size:.92rem;text-transform:lowercase}
.hint{font-size:.88rem;color:var(--mute);margin:6px auto 0;max-width:42ch;text-align:center}

.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;padding-inline:0!important;padding:6px 16px 0;font-size:.8rem;letter-spacing:.04em;color:var(--mute)}
.foot a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px}
.foot a:hover,.foot a:focus-visible{color:var(--amber);border-bottom-color:currentColor;outline:none}
</style>
</head>
<body>

<canvas id="dial" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="titleblock">
      <h1>galaverna</h1>
      <span class="tag">frozen stillness</span>
    </div>
    <div class="side">
      <span id="clock">00:00</span>
      <span id="tideNo">tide</span>
    </div>
  </header>

  <button class="stage" id="toggle" type="button" aria-pressed="false" aria-label="Tune in">
    <span id="tap">tune in</span>
  </button>

  <div class="cap">
    <span id="nowA" hidden>∇²φ = 0</span>
    <span id="nowB" hidden>track 1, bar 1 of 96 at 58 bpm</span>
    <p class="hint" id="hint">Always on air. Tides rise from still, cold ambient into 2-step and fall back. Everything is generated in real time. Everything is in sync worldwide, even when offline.</p>
  </div>

  <footer class="foot"><a href="https://github.com/phonk/galaverna">source on github</a><span aria-hidden="true">·</span><a href="https://phonk.github.io/" target="_blank" rel="noopener">phonk</a><span aria-hidden="true">·</span><a href="https://alessandrobonino.com/" target="_blank" rel="noopener">alessandro bonino</a><span aria-hidden="true">·</span><span id="ver">v29</span></footer>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  /* a broadcast: everyone who tunes in must hear the same thing, so nothing that decides what is played is left to chance.
     every tide (half an hour of the clock, the same for the whole world) has a number, and that number is the seed of
     everything in it. there are three streams of numbers: one for what happens bar by bar (which track comes next, how
     its patterns change), which has to be replayed from the start of the tide by whoever arrives late; one that starts
     again at every step, for what happens inside it; and one per track, for the small differences in how it sounds */
  const TIDE = 1800;
  const mix32 = (a, b) => { let v = Math.imul(a ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul(b + 0x7F4A7C15 | 0, 0xC2B2AE35); v ^= v >>> 15; v = Math.imul(v, 0x2C1B3C6D); v ^= v >>> 12; v = Math.imul(v, 0x297A2D39); return (v ^ v >>> 15) | 0; };
  const stream = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  let K = 0, barRng = stream(1), RNG = barRng;
  const rnd = (a, b) => a + RNG() * (b - a);
  const pick = a => a[Math.floor(RNG() * a.length)];
  const chance = p => RNG() < p;
  const withRng = (r, fn) => { const keep = RNG; RNG = r; try { return fn(); } finally { RNG = keep; } };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ss = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
  const KEYS = ['c', 'c♯', 'd', 'e♭', 'e', 'f', 'f♯', 'g', 'a♭', 'a', 'b♭', 'b'];
  /* everything is counted from the root of a minor key, in semitones */
  const CHORDS = [[0, 3, 7, 10], [0, 3, 7, 10, 14], [0, 7, 10, 15], [0, 5, 7, 10], [0, 3, 10, 14], [0, 7, 15, 17], [0, 3, 7, 14]];
  const VOICINGS = [[0, 7, 15, 22], [0, 7, 10, 15], [-12, 0, 7, 15], [0, 7, 15, 19]];
  const GROOVES = [
    [[0, 10], [4, 12], [0, 10], [4, 12]], [[0, 11], [4, 12], [0, 10], [4, 12]], [[0, 7], [4, 12], [0, 7, 10], [12]],
    [[0], [8], [0, 10], [8]], [[0], [8], [0], [8, 14]], [[0, 14], [8], [6], [8]], [[0, 3], [8], [0, 11], [8]],
    [[0, 6], [4, 13], [0, 10], [4, 12]], [[0, 9], [4, 15], [0], [4, 12]], [[0], [6, 12], [0, 10], [6]],
    [[0, 6, 12], [4], [0, 6], [4, 12]], [[0, 5, 10], [12], [0, 5], [8, 12]],
    [[0, 10], [4], [3, 10], [12]], [[0], [4], [2, 10], [12]]
  ];
  const HATS = [[2, 6, 10, 14], [6, 14], [2, 3, 10, 11], [6, 7, 14, 15], [3, 7, 11, 15], [2, 10], [3, 11], [2, 7, 10, 15], [], []];
  /* a track has no key on its sleeve, only a name: something from mathematics, a concept or a formula, chosen for being still, empty or cold */
  const NAMES = [
    'empty set', 'null set', 'measure zero', 'almost everywhere', 'nowhere dense', 'limit point', 'fixed point', 'accumulation point',
    'asymptote', 'singularity', 'essential singularity', 'removable discontinuity', 'branch cut', 'residue', 'principal value',
    'cantor dust', 'koch snowflake', 'hausdorff dimension', 'strange attractor', 'limit cycle', 'period doubling', 'bifurcation',
    'minimal surface', 'geodesic', 'tangent bundle', 'möbius band', 'klein bottle', 'quotient space', 'open cover', 'compact support',
    'harmonic function', 'heat kernel', 'laplacian', 'dirac delta', 'step function', 'convolution', 'fourier series', 'standing wave',
    'random walk', 'brownian motion', 'martingale', 'ergodic', 'stationary distribution', 'zero divisor', 'kernel', 'torsion', 'lattice',
    'voronoi cell', 'catenary', 'cycloid', 'cardioid', 'prime gap', 'twin primes', 'aleph null', 'continuum', 'well-ordering',
    'hilbert space', 'orthogonal complement', 'eigenvalue', 'trivial solution', 'vanishing point', 'steady state', 'absolute convergence',
    '∇²φ = 0', '∂u/∂t = α∇²u', '∂∂ = 0', 'dx/dt = 0', 'f′(x) = 0', 'det A = 0', 'A = Aᵀ', 'ζ(s) = 0', 'i² = −1', 'e^iπ + 1 = 0',
    'φ² = φ + 1', '0.999… = 1', 'lim 1/n = 0', '|x| < ε', '∀ε ∃δ', '∮ f dz = 0', '∫ e^−x² dx = √π', '∑ 1/n² = π²/6', 'z² + c',
    'V − E + F = 2', 'x ≡ 0 (mod p)', 'sin x / x', 'ℵ₀', '∅', 'ker f', 'x ∉ x', '1 − 1/3 + 1/5 − …', 'n! ~ √(2πn)(n/e)ⁿ'
  ];
  const MELS = [[14, 15], [14, 15, 14, 12], [10, 8], [19, 20, 19, 17], [14, 14, 15, 12]];
  const FLOOR = [[0, 0, -4, -4], [0, 0, 0, -4, 0, 0, -2, -2], [0, -4, -7, -2], [0, 0, -7, -7], [0, 0, 0, 0], [0, 0, -4, -2]];
  const BASS_PATTERNS = [[2, 6, 10, 14], [3, 6, 11, 14], [2, 7, 10], [6, 14], [2, 3, 10, 11], [3, 10], [2, 6, 11]];
  const SUBPATS = [
    [1, 0, 0, 0, .6, 0, 0, 0, .8, 0, 0, 0, .6, 0, 0, 0],
    [1, 0, .5, 0, .7, 0, .5, 0, .9, 0, .5, 0, .7, 0, .5, 0],
    [1, 0, 0, .5, 0, 0, .7, 0, 0, 0, .6, 0, 0, .5, 0, 0],
    [1, 0, 0, 0, 0, 0, .6, 0, .8, 0, 0, 0, 0, 0, .5, 0]
  ];

  let ac = null, mix, master, bed, noiseBuf, crackleBuf, irBuf;
  let decks = [], cur = 0, curL = 96, curT = 16, trackNo = 0;
  let step = 0, nextTime = 0, baseBpm = 114, t0 = 0, bpmNow = 114;
  const VER = 'v29', LITE = window.matchMedia('(pointer: coarse)').matches;
  let playing = false, worker = null, fallbackTimer = null, silentEl = null;
  /* the tide: 0 is onde, 1 is nebbia */
  let x = 0.04, dry = false;
  const events = [];

  /* ---------- raw material ---------- */
  function makeNoise(seconds) {
    const b = ac.createBuffer(1, ac.sampleRate * seconds, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function makeCrackle(seconds) {
    const b = ac.createBuffer(1, ac.sampleRate * seconds, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() < 0.0005 ? (Math.random() * 2 - 1) : 0;
    return b;
  }
  function makeImpulse(seconds) {
    const sr = ac.sampleRate, n = Math.floor(sr * seconds), b = ac.createBuffer(2, n, sr);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c); let y = 0;
      for (let i = Math.floor(sr * 0.018); i < n; i++) {
        const t = i / sr, v = (Math.random() * 2 - 1) * Math.exp(-t * 0.9);
        const a = 0.5 * Math.exp(-t * 0.75) + 0.05;   /* the tail gets darker as it dies */
        y += a * (v - y); d[i] = y;
      }
    }
    return b;
  }
  function tanhCurve(k, out) {
    const c = new Float32Array(1025);
    for (let i = 0; i < 1025; i++) c[i] = Math.tanh((i / 512 - 1) * k) * out;
    return c;
  }

  /* ---------- a deck: one track, with everything it may need at either end of the tide ---------- */
  class Deck {
    constructor(i) {
      this.i = i; this.keep = [];
      withRng(stream(mix32(K, 7000 + i)), () => this.wire());
      this.track = null; this.voices = []; this.live = []; this.inAt = null; this.outAt = null;
    }
    wire() {
      const g = v => { const n = ac.createGain(); n.gain.value = v; return n; };
      const bq = (type, f, q) => { const n = ac.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
      const lfo = (f, depth, target) => { const o = ac.createOscillator(); o.frequency.value = f; const og = g(depth); o.connect(og); og.connect(target); o.start(); this.keep.push(o); };
      this.g = g; this.bq = bq;
      this.out = g(0); this.lp = bq('lowpass', 18000, 0.5); this.pre = g(1);
      this.pre.connect(this.lp); this.lp.connect(this.out); this.out.connect(mix);
      this.duck = g(1); this.duck.connect(this.pre);
      this.drum = g(1); this.drum.connect(this.pre);
      /* the drums are driven hard into a clipper of their own: that is what makes them loud, short and ugly, and puts them in front */
      this.front = g(3.2); const crush = ac.createWaveShaper(); crush.curve = tanhCurve(4.5, 0.62); crush.oversample = '2x';
      this.front.connect(crush); crush.connect(this.pre);
      this.subBus = g(0.5); this.subBus.connect(this.pre);

      /* stabs: overdrive, tape warble, phaser */
      this.chordBus = g(1); this.chordBus.connect(this.duck);
      this.drive = g(2); this.dirt = ac.createWaveShaper();
      { const dc = new Float32Array(1025); for (let k = 0; k < 1025; k++) { const v = (k / 512 - 1) * 3; dc[k] = Math.tanh(v + 0.18 * v * v); } this.dirt.curve = dc; this.dirt.oversample = '2x'; }
      const dirtOut = g(0.34), hp = bq('highpass', 35, 0.5);
      this.warb = ac.createDelay(0.2); this.warb.delayTime.value = 0.03;
      this.warbDepth = g(1); this.warbDepth.connect(this.warb.delayTime);
      lfo(rnd(0.35, 0.6), 0.0028, this.warbDepth); lfo(rnd(0.07, 0.13), 0.006, this.warbDepth); lfo(rnd(6, 8.5), 0.00006, this.warbDepth);
      this.drive.connect(this.dirt); this.dirt.connect(dirtOut); dirtOut.connect(hp); hp.connect(this.warb);
      const phDepth = g(600); { const o = ac.createOscillator(); o.frequency.value = rnd(0.05, 0.2); o.connect(phDepth); o.start(); this.keep.push(o); }
      let node = this.warb;
      for (let k = 0; k < 4; k++) { const ap = bq('allpass', 900 + k * 500, 0.7); phDepth.connect(ap.frequency); node.connect(ap); node = ap; }
      this.warb.connect(this.chordBus); { const pm = g(0.6); node.connect(pm); pm.connect(this.chordBus); }

      /* pads: their own wobbling tape, and a level that follows the tide */
      this.padBus = g(1);
      const pw = ac.createDelay(0.2); pw.delayTime.value = 0.03;
      lfo(rnd(0.3, 0.5), 0.0022, pw.delayTime); lfo(rnd(0.06, 0.11), 0.005, pw.delayTime); lfo(rnd(5.5, 7.5), 0.00005, pw.delayTime);
      this.padOut = g(1);
      /* the pad is held off the ground: its lowest octave is taken away, and a narrow bright band drifts slowly up and down through what is left */
      const lift = ac.createBiquadFilter(); lift.type = 'highpass'; lift.frequency.value = 420; lift.Q.value = 0.7;
      const band = ac.createBiquadFilter(); band.type = 'peaking'; band.frequency.value = 1700; band.Q.value = 1.1; band.gain.value = 3.5;
      lfo(rnd(0.03, 0.07), 1100, band.detune); lfo(rnd(0.011, 0.02), 600, band.detune);
      /* and a note that sticks out is held down: with tones this pure, one voice swelling under the bright band can sing like feedback */
      const hold = ac.createDynamicsCompressor(); hold.threshold.value = -30; hold.knee.value = 10; hold.ratio.value = 8; hold.attack.value = 0.05; hold.release.value = 0.6;
      const makeup = g(1.25);
      this.padBus.connect(pw); pw.connect(lift); lift.connect(band); band.connect(hold); hold.connect(makeup); makeup.connect(this.padOut); this.padOut.connect(this.duck);

      this.pingBus = g(1); { const d = g(0.5); this.pingBus.connect(d); d.connect(this.pre); }

      /* the echo: filtered, saturated, never running away */
      this.delay = ac.createDelay(2.5);
      this.delaySend = g(0.5); this.fb = g(0.5);
      const fbHP = bq('highpass', 280, -3); this.fbLP = bq('lowpass', 2200, -3);
      const sat = ac.createWaveShaper(); sat.curve = tanhCurve(2, 0.9);
      const delayOut = g(0.7);
      this.pan = ac.createStereoPanner ? ac.createStereoPanner() : g(1);
      this.chordBus.connect(this.delaySend); this.delaySend.connect(this.delay);
      { const d = g(0.8); this.pingBus.connect(d); d.connect(this.delay); }
      this.delay.connect(fbHP); fbHP.connect(this.fbLP); this.fbLP.connect(this.fb); this.fb.connect(sat); sat.connect(this.delay);
      this.delay.connect(delayOut); delayOut.connect(this.pan); this.pan.connect(this.duck);
      if (this.pan.pan) lfo(rnd(0.04, 0.09), 0.55, this.pan.pan);
      lfo(0.23, 0.0018, this.delay.delayTime);

      this.rev = ac.createConvolver(); this.rev.buffer = irBuf;
      this.revSend = g(0.3); this.revIn = g(1); this.revIn.connect(this.rev);
      { const o = g(0.55); this.rev.connect(o); o.connect(this.pre); }
      this.chordBus.connect(this.revSend); this.revSend.connect(this.revIn);
      [[this.delay, 0.35], [this.padOut, 0.8], [this.pingBus, 0.9]].forEach(([n, v]) => { const s = g(v); n.connect(s); s.connect(this.revIn); });

      this.windOut = g(1); this.windOut.connect(this.pre); this.windOut.connect(this.revIn);
    }

    load(tr, bar, t, fadeBars, barDur, first, serial) {
      this.track = tr; this.startBar = bar; this.bn = null; this.mn = null; this.dubOut = false; this.serial = serial;
      this.kickFrom = bar + (first ? 4 : fadeBars); this.kickUntil = Infinity;
      const fade = Math.max(fadeBars, 2) * barDur;
      this.inAt = { t, dur: first ? 3 * barDur : fade, fdur: first ? 8 * barDur : fade, f0: first ? 500 : 320, sd: barDur / 16 }; this.outAt = null;
      if (!dry) this.sound(t);
    }
    /* make the deck sound the way it should at time t, wherever in its fades that falls: at the load when listening live,
       somewhere in the middle of the track for whoever has just tuned in */
    sound(t, keep) {
      const tr = this.track; if (!tr) return;
      const a = this.inAt, o = this.out.gain, f = this.lp.frequency, p = clamp((t - a.t) / a.dur, 0, 1), q = clamp((t - a.t) / a.fdur, 0, 1);
      o.cancelScheduledValues(t); o.setValueAtTime(Math.max(0.0001, p), t); if (p < 1) o.linearRampToValueAtTime(1, a.t + a.dur);
      f.cancelScheduledValues(t); f.setValueAtTime(a.f0 * Math.pow(18000 / a.f0, q), t); if (q < 1) f.exponentialRampToValueAtTime(18000, a.t + a.fdur);
      this.delay.delayTime.cancelScheduledValues(t); this.delay.delayTime.setValueAtTime(tr.delaySteps * a.sd, t);
      this.fb.gain.cancelScheduledValues(t); this.fb.gain.setValueAtTime(tr.fb, t);
      this.fbLP.frequency.setValueAtTime(tr.fbTone, t);
      this.delaySend.gain.setValueAtTime(tr.delaySend, t); this.revSend.gain.setValueAtTime(tr.revSend, t);
      this.warbDepth.gain.setValueAtTime(tr.warble, t);
      if (!keep) withRng(stream(mix32(K, 9000 + this.serial)), () => this.startVoices(t));
      if (this.outAt) this.fadeOut(t);
    }

    startVoices(t) {
      const tr = this.track, g = this.g, bq = this.bq;
      this.voices = []; this.live = [];
      const notes = tr.voicing.map(n => ({ n, mel: false })).concat([{ n: tr.mel[0], mel: true }], tr.air.map(n => ({ n, mel: false, air: true })));
      const lv = 0.36 * tr.padLevel / Math.sqrt(notes.length);
      /* every voice of the pad swells and fades on its own clock */
      for (const { n, mel, air } of notes) {
        const k = air ? 3 : mel ? 1.5 : 1, a = air ? 0.4 : 1;
        const f = bq('lowpass', tr.padCut * k, 0.7), vg = g(lv * 0.5 * a);
        const per = rnd(18, 46), ts = t + rnd(0, per * 0.5);
        const lf = ac.createOscillator(), lg = g(lv * 0.5 * a); lf.frequency.value = 1 / per; lf.connect(lg); lg.connect(vg.gain); lf.start(ts);
        /* the pitch of every voice wanders on its own, a few cents sharp, a few flat, never where the others are */
        const wf = ac.createOscillator(), wg = g(air ? rnd(14, 26) : rnd(7, 15)); wf.frequency.value = rnd(0.03, 0.11); wf.connect(wg); wf.start(t);
        const oscs = [-1, 1].map(s => {
          const o = ac.createOscillator(); o.type = air || s > 0 ? 'sine' : 'triangle';   /* no saws: thin, cold tones */
          o.frequency.value = mtof(tr.base + n + (air ? 0 : tr.lift)); o.detune.value = s * rnd(7, 16); wg.connect(o.detune); o.connect(f); o.start(t); return o;
        });
        /* rarefied: each voice passes through a second, slower swell, so most of the time it is not there at all and the chord is never whole */
        const per2 = rnd(29, 71), vg2 = g(0.5), lf2 = ac.createOscillator(), lg2 = g(0.5);

    const w = Date.now() / 1000, s = Math.floor(w % TIDE), p = n => String(n).padStart(2, '0');
    $('clock').textContent = p(Math.floor(s / 60)) + ':' + p(s % 60); $('tideNo').textContent = 'tide ' + Math.floor(w / TIDE);
  }
  setInterval(onAir, 250); onAir();
  /* the shape of the water right now: every sounding voice is one ripple. low notes are long waves, high notes short ones,
     and a voice that swells makes its ripple taller. the higher the tide, the tighter the surface is pulled */
  function chord(now, time, m) {
    const out = [], amp = (H / 700) * lerp(15, 5, m);
    const add = (n, l, seed) => out.push({ f: TAU * (0.9 + clamp((n + 12) / 36, 0, 1) * 6.5), a: l, ph: seed * 1.7 + time * (0.07 + (seed % 5) * 0.014) * (seed % 2 ? 1 : -1) });
    if (playing && decks.length) for (let d = 0; d < 2; d++) {
      const dk = decks[d]; if (!dk.track) continue;
      const lv = clamp(dk.out.gain.value, 0, 1);
      dk.voices.forEach((v, k) => add(v.n, (now > v.ts ? 0.5 + 0.5 * Math.sin(TAU * (now - v.ts) / v.per) : 0.5) * lv, d * 7 + k * 3 + 1));
    }
    if (!out.length) REST.forEach((v, k) => add(v.n, v.l, k * 3 + 1));
    const k = amp * 1.5 / Math.sqrt(out.length);
    out.forEach(c => { c.a *= k; });
    return out;
  }
  /* how far a line stands above its level at u (0 left, 1 right): its ripples, the notches a kick cut, the swell of a pulse */
  function lineY(s, u) {
    let y = 0;
    for (const c of s.comps) y += c.a * Math.sin(c.f * u + c.ph);
    for (const n of s.notches) { const d = Math.abs(u - n[0]) * W / 9; if (d < 1) y -= n[1] * (1 - d); }
    if (s.bump) { const d = (u - s.bump[0]) / 0.11; y -= s.bump[1] * Math.exp(-d * d); }
    return y;
  }
  function deposit(color, a, more) {
    const last = strata[strata.length - 1];
    if (last && clock - lastDep < 0.07) { // two things at the same instant are one line
      if (more.notches) last.notches = more.notches;
      if (more.bump) last.bump = more.bump;
      if (color !== INK) last.col = color;
      last.a = Math.max(last.a, a); mark(last); return;
    }
    const s = { y: water, born: clock, comps: more.comps, notches: more.notches || [], bump: more.bump || null, col: color, a, w: 1 };
    strata.push(s); lastDep = clock; depN++; mark(s);
    if (strata.length > 320) strata.shift();
  }
  /* the first line of a bar is a little stronger; the first line of a new track is amber, a seam in the rock */
  function mark(s) {
    if (!barMark || clock - barMark.t > 0.15) return;
    if (barMark.first) { s.col = NIGHT; s.a = 0.9; s.w = 1.3; } else s.a = Math.max(s.a, 0.62);
    barMark = null;
  }
  /* before the first start there is no past yet: lay down a quiet one, so the page is not empty */
  function seed(comps) {
    strata = [];
    for (let i = 26; i >= 1; i--) strata.push({ y: water + i * (7 + i * 0.75), born: 0, comps: comps.map(c => ({ f: c.f, a: c.a * (0.5 + hash(i * 3 + c.f)), ph: c.ph + i * 0.37 })),
      notches: [], bump: i % 6 === 2 ? [hash(i), 9] : null, col: i === 14 ? AMBER : i % 9 === 4 ? WINE : INK, a: i === 14 ? 0.8 : 0.4, w: 1 });
  }

  function draw() {
    const wall = performance.now(), dt = Math.min(0.1, (wall - lastWall) / 1000), box = btn.getBoundingClientRect();
    lastWall = wall;
    const scale = H / 700, SINK = clamp(H / 55, 9, 18), time = still ? 0 : wall / 1000;
    let now = 0, phase = 0;
    xv += (x - xv) * (playing ? 0.02 : 1);
    const m = xv, low = box.bottom - box.height * 0.06, high = box.top + box.height * 0.14, target = lerp(low, high, m);
    /* the water follows the tide, but never falls faster than its own sediment sinks: lines must not cross */
    if (water === null || !playing) water = target;
    else water += clamp(target - water, -70 * dt, SINK * 0.7 * dt);

    if (playing && ac) {
      clock += dt;
      now = ac.currentTime - (ac.outputLatency || 0);
      const comps = () => chord(now, time, m);
      while (events.length && events[0].t <= now) {
        const e = events.shift();
        if (e.kind === 'pulse') {
          pulse = Math.max(pulse, e.vel);
          if (clock - lastKick > 0.1) deposit(INK, 0.26 + 0.3 * e.vel, { comps: comps(), bump: [0.12 + 0.76 * hash(depN * 1.3), (6 + 15 * e.vel) * scale] });
        } else if (e.kind === 'kick') {
          kickP = Math.max(kickP, e.lv); lastKick = clock;
          deposit(INK, 0.3 + 0.2 * e.lv, { comps: comps(), notches: veins.map(v => [v, (3 + 10 * e.lv) * scale]) });
        } else if (e.kind === 'stab') {
          deposit(WINE, 0.2 + 0.45 * e.vel, { comps: comps() });
          for (let n = 1, a = e.vel * 0.4 * e.fb; n < 5 && a > 0.06; n++, a *= e.fb) echoes.push({ at: clock + n * e.d, a });
        } else if (e.kind === 'ping') grains.push({ u: 0.04 + 0.92 * Math.random(), y: water, born: clock });
        else if (e.kind === 'bar') {
          if (!vis || vis.track !== e.track) veins = Array.from({ length: 3 + e.track % 4 }, (_, i) => 0.06 + 0.88 * hash(e.track * 13.7 + i * 3.1));
          vis = e; barMark = { t: clock, first: e.rel === 0 };
          const last = strata[strata.length - 1]; if (last && clock - lastDep < 0.05) mark(last);
          $('nowA').textContent = e.key;
          $('nowB').textContent = 'track ' + e.track + ', bar ' + (e.rel + 1) + ' of ' + e.L + ' at ' + Math.round(e.x < 0.3 ? e.bpm / 2 : e.bpm) + ' bpm';
        }
      }
      echoes = echoes.filter(e => { if (e.at > clock) return true; deposit(WINE, e.a, { comps: comps() }); return false; });
      /* a bar in which nothing struck still leaves its line */
      if (barMark && clock - barMark.t >= 0.15) { if (lastDep < barMark.t - 0.05) { barMark.t = clock; deposit(INK, 0.3, { comps: comps() }); } barMark = null; }
      if (vis && !still) phase = clamp((now - vis.t) / vis.dur, 0, 1);
    }
    const liveC = chord(now, time, m);
    if (virgin && !playing) seed(liveC);

    g.clearRect(0, 0, W, H);
    /* light in the water, pushed by the pulse and the kick */
    const grad = g.createRadialGradient(W / 2, water + H * 0.3, 0, W / 2, water + H * 0.3, Math.max(W, H) * 0.75);
    grad.addColorStop(0, NIGHT); grad.addColorStop(1, 'rgba(74,140,196,0)');
    g.globalAlpha = 0.09 + 0.2 * Math.max(pulse, kickP * 0.6) + (playing ? 0.04 : 0); g.fillStyle = grad; g.fillRect(0, 0, W, H);

    /* the sediment */
    const NP = clamp(Math.round(W / 8), 60, 170), depth = H - water + 20;
    strata = strata.filter(s => s.y + (clock - s.born) * SINK < H + 30);
    for (const s of strata) {
      const y = s.y + (clock - s.born) * SINK, f = clamp(1 - (y - water) / depth, 0, 1), a = s.a * Math.pow(f, 1.5);
      if (a < 0.012) continue;
      g.globalAlpha = a; g.strokeStyle = s.col; g.lineWidth = s.w; g.beginPath();
      for (let i = 0; i <= NP; i++) { const u = i / NP; i ? g.lineTo(u * W, y + lineY(s, u)) : g.moveTo(0, y + lineY(s, u)); }
      g.stroke();
    }
    /* the high pings are grains of amber: they drop on the water and go down with the rest */
    grains = grains.filter(p => p.y + (clock - p.born) * SINK < H + 10);
    for (const p of grains) {
      const age = clock - p.born, y = p.y + age * SINK, f = clamp(1 - (y - water) / depth, 0, 1);
      g.globalAlpha = 0.95 * f; g.fillStyle = INK; g.beginPath(); g.arc(p.u * W, y, 1.7, 0, TAU); g.fill();
      if (age < 0.9 && !still) { g.globalAlpha = 0.7 * (1 - age / 0.9); g.strokeStyle = INK; g.lineWidth = 1; g.beginPath(); g.ellipse(p.u * W, p.y, 3 + age * 26, 1 + age * 7, 0, 0, TAU); g.stroke(); }
    }

    /* the water itself */
    const live = { comps: liveC, notches: kickP > 0.02 ? veins.map(v => [v, 11 * kickP * scale]) : [], bump: pulse > 0.02 ? [0.5, 16 * pulse * scale] : null };
    const trace = () => { g.beginPath(); for (let i = 0; i <= NP; i++) { const u = i / NP; i ? g.lineTo(u * W, water + lineY(live, u)) : g.moveTo(0, water + lineY(live, u)); } g.stroke(); };
    g.globalAlpha = 0.95; g.strokeStyle = INK; g.lineWidth = 1.4; trace();
    if (playing && vis) {
      /* how far the track has gone is the amber stretch of the water; the bar is the dot that rides it */
      g.save(); g.beginPath(); g.rect(0, 0, W * Math.min(1, (vis.rel + phase) / vis.L), H); g.clip();
      g.globalAlpha = 1; g.strokeStyle = NIGHT; trace(); g.restore();
      g.globalAlpha = 1; g.fillStyle = WINE; g.beginPath(); g.arc(phase * W, water + lineY(live, phase), 3.5, 0, TAU); g.fill();
    }
    /* the gauge: where the water can stand, from onde at the bottom to nebbia at the top */
    g.globalAlpha = 0.22; g.strokeStyle = INK; g.lineWidth = 1;
    for (let i = 0; i <= 10; i++) { const y = Math.round(lerp(low, high, i / 10)) + 0.5; g.beginPath(); g.moveTo(0, y); g.lineTo(i % 5 ? 7 : 14, y); g.stroke(); }
    g.globalAlpha = 1;
    pulse *= 0.94; kickP *= 0.88;
    if (playing) requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('scroll', () => { if (!playing) draw(); }, { passive: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  resize();
})();

  /* keep a copy of the page on the device, so the station can be opened with no network */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<script data-goatcounter="https://phonk.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
